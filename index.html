<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--  -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <!--  -->
    <title>Login - WEB MESSAGE</title>
    <link rel="stylesheet" href="CSS/message__style.css">
</head>
<body class="login-body">
    
    <div class="login-container">
        <h2>Iniciar Sesión</h2>
        
        <form id="login-form">
            <div class="input-group">
                <input type="email" id="login-email" placeholder="Correo electrónico" required autocomplete="email">
            </div>
            <div class="input-group">
                <input type="password" id="login-password" placeholder="Contraseña" required autocomplete="current-password">
            </div>
            <button type="submit" id="loginBtn" class="login-btn">Entrar</button>
            <p id="login-error" class="error-msg"></p>
        </form>
    </div>

    <script type="module" src="./JS/login.js"></script>
</body>
</html>
