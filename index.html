<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEB MESSAGE</title>
    <link rel="stylesheet" href="CSS/message__style.css">
</head>
<body>
    <!-- Pantalla de Login -->
    <div id="login-screen" class="login-container">
        <h2>Iniciar Sesión</h2>
        <form id="login-form">
            <input type="email" id="login-email" placeholder="Correo electrónico" required />
            <input type="password" id="login-password" placeholder="Contraseña" required />
            <button type="submit">Ingresar</button>
            <p id="login-error" class="error-msg"></p>
        </form>
    </div>

    <!-- Pantalla del Chat -->
    <div id="chat-app" class="chat_container" style="display: none;">
        
        <!-- 1. ENCABEZADO -->
        <header class="chat-header">
            <div class="user-info">
                <h2>Knot</h2>
                <span id="user-status" class="user-status">Online</span>
            </div>
        </header>

        <!-- 2. ÁREA DE MENSAJES -->
        <main id="chat-box" class="chat-box"> 
            <!-- Mensajes dinámicos -->
        </main>

        <!-- 3. FORMULARIO CON INPUT Y BOTONES -->
        <form id="chatForm" class="chat-input-area">
            <input type="text" id="message-input" placeholder="escribe un mensaje..." required autocomplete="off">
            <button type="submit" id="sendButton">SEND</button>
            <button type="button" id="btn-panico" class="panic-btn">BTN P</button>
        </form>

    </div>

    <!-- Scripts JS -->
    <script type="module" src="./JS/Firebase.js"></script>
    <script type="module" src="./JS/presence.js"></script>
    <script type="module" src="./JS/btn_panic.js"></script>
    <script type="module" src="./JS/main.js?v=2"></script>
    <script type="module" src="./JS/login.js"></script>
</body>
</html>
